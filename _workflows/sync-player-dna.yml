name: Player DNA Sync

# Rechnet die Player-DNA-Perzentile (QB/RB/WR/TE) aus nflverse neu:
# Stats, Next Gen Stats, Snap Counts. Vorjahre werden aus der bestehenden
# data/player-dna.js uebernommen, neu gerechnet wird nur die laufende Saison.
# nflverse aktualisiert nachts (US-Zeit) -> Lauf morgens deutscher Zeit.
# Keine Secrets noetig.

on:
  schedule:
    - cron: "40 7 * * *"   # 09:40 Berlin (Sommerzeit) / 08:40 (Winterzeit)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Player DNA Sync
        run: node scripts/sync-player-dna.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "dpe-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/player-dna.js
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: Player DNA sync"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
