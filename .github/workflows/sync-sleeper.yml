name: Sleeper Sync

# Synct ALLES Liga-Spezifische aus der oeffentlichen Sleeper-API
# (Teams, Kader, Scores, Spielplan, Rookie Draft, Trades, Picks, Stats,
# Projektionen, Liga-Settings) und berechnet danach den Fantasy Power
# Score neu. Keine Secrets noetig -- Sleeper ist ohne Login lesbar.
#
# Laeuft alle 2 Stunden + manuell startbar ("Run workflow" im Actions-Tab).
# Dateien werden nur geschrieben, wenn sich wirklich etwas geaendert hat.

on:
  schedule:
    - cron: "15 */2 * * *"   # alle 2 Stunden (UTC), Minute 15
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache-Key (taeglich) bestimmen
        id: cachekey
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Sleeper players/nfl cachen (~5MB, nur 1x/Tag laden)
        uses: actions/cache@v4
        with:
          path: /tmp/sleeper-players-slim.json
          key: sleeper-players-slim-${{ steps.cachekey.outputs.date }}

      - name: Sleeper Sync
        env:
          SLEEPER_PLAYERS_CACHE_PATH: /tmp/sleeper-players-slim.json
        run: node scripts/sync-sleeper.js

      - name: Fantasy Power Score
        run: node scripts/sync-fantasy-position-score.js

      - name: Commit & Push falls geändert
        run: |
          git config user.name "dpe-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen -- nichts zu committen."
            exit 0
          fi
          git commit -m "chore: Sleeper sync"
          # Mehrere Sync-Workflows laufen zeitlich dicht beieinander und
          # committen unabhaengig voneinander -- bei abgelehntem Push
          # (non-fast-forward) rebasen und erneut versuchen.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5) -- hole aktuellen Stand und versuche erneut..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nach 5 Versuchen weiterhin fehlgeschlagen -- bitte Workflow-Log prüfen."
          exit 1
